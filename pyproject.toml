[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rubric-pii-bench"
version = "0.1.0"
description = "Reproduction code for rubric-guided contrastive synthesis for lightweight PII detection"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "openai>=1.0.0",
    "pyyaml>=6.0.0",
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "tqdm>=4.66.0",
    "transformers>=4.40.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.8.0"]
serve = ["hf-transfer>=0.1.0", "vllm>=0.8.0"]

[project.scripts]
paper-bench = "pii_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["S101", "S311"]

[tool.ruff.lint.per-file-ignores]
"src/pii_bench/rubric_guided_contrastive_synthesis.py" = ["E501"]
